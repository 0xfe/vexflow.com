<!doctype html>
<!-- Shared local playground template; the build selects the example and hashed assets. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}} example</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body class="embedded-example" data-example="{{EXAMPLE}}" data-runtime="../{{RUNTIME}}">
  <section class="playground" aria-label="{{TITLE}} example">
    <div class="playground-toolbar">
      <div role="tablist" aria-label="Example views">
        <button type="button" id="result-tab" role="tab" aria-selected="true" aria-controls="result-panel" data-panel="result">Result</button>
        <button type="button" id="javascript-tab" role="tab" aria-selected="false" aria-controls="javascript-panel" data-panel="javascript" tabindex="-1">JavaScript</button>
      </div>
      <div class="playground-actions">
        <button type="button" id="run" title="Run (Cmd/Ctrl+Enter)">Run</button>
        <button type="button" id="reset">Reset</button>
      </div>
    </div>
    <div id="result-panel" role="tabpanel" aria-labelledby="result-tab">
      <div id="preview"></div>
      <p id="error" role="alert" hidden></p>
    </div>
    <div id="javascript-panel" role="tabpanel" aria-labelledby="javascript-tab" hidden>
      <div id="editor" role="textbox" aria-label="Editable JavaScript example" aria-multiline="true" spellcheck="false"></div>
    </div>
    <span id="status" class="visually-hidden" role="status">Loading…</span>
  </section>
  <script src="../{{EDITOR}}"></script>
</body>
</html>
