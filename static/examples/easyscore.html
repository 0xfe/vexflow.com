<!doctype html>
<!-- Editable EasyScore playground. The build supplies the hashed scripts. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VexFlow example</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body data-runtime="../{{RUNTIME}}">
  <section class="playground" aria-label="VexFlow example">
    <div id="preview"></div>
    <div id="editor" class="live-source" role="textbox" aria-label="Editable VexFlow JavaScript" aria-multiline="true" spellcheck="false"></div>
    <pre id="error" class="live-error" role="status"></pre>
  </section>
  <script src="../{{EDITOR}}"></script>
</body>
</html>
